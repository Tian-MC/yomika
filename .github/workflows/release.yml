name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Branch/manual runs upload installable packages; tags also publish a GitHub release.
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  bundle:
    name: Build AppImage, deb, rpm
    # Build on the oldest supported Ubuntu: the AppImage bundles WebKitGTK/GTK from the build
    # host, and binaries only run on distros with a glibc at least as new as the builder's.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $conf"
            exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ubuntu-22.04

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build and bundle Linux packages
        env:
          # linuxdeploy/appimagetool are themselves AppImages; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/bundle-linux.sh

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist-release
          cp target/release/bundle/appimage/*.AppImage \
             target/release/bundle/deb/*.deb \
             target/release/bundle/rpm/*.rpm dist-release/
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-test the AppImage
        run: |
          app=$(ls dist-release/*.AppImage)
          chmod +x "$app"
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/yomika
          ldd squashfs-root/usr/bin/yomika | tee ldd.txt
          if grep -q 'not found' ldd.txt; then echo "::error::unresolved libraries"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: yomika-linux-x86_64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yomika-linux-x86_64
          path: dist-release

      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*
