[package]
name = "vnl-translate"
description = "Text extraction, OCR and translation pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vnl-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
which.workspace = true
tempfile.workspace = true
nix = { workspace = true, features = ["fs"] }
base64 = "0.22"
url = "2"
futures-util = "0.3"
# xdg-desktop-portal Screenshot (same zbus major as the Secret Service store).
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Secret Service (gnome-keyring / KWallet / KeePassXC) for API keys.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
