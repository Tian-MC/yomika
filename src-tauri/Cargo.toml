[package]
name = "vnl-app"
description = "VN Launcher desktop application (Tauri shell and integration layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "vn-launcher"

[lib]
name = "vnl_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vn-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
vnl-core.workspace = true
vnl-runtime.workspace = true
vnl-library.workspace = true
vnl-translate.workspace = true
vnl-graphics.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
